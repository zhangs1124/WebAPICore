                      - img "Docker" [ref=f11e479]
                  - paragraph [ref=f11e480]:
                    - text: 一個遵循
                    - strong [ref=f11e481]: Clean Code
                    - text: 、
                    - strong [ref=f11e482]: RESTful 規範
                    - text: 、
                    - strong [ref=f11e483]: ACID 資料庫交易保證
                    - text: 與
                    - strong [ref=f11e484]: Modal-First SPA CRUD
                    - text: 架構的高效能企業級進銷存管理系統。串接
                    - strong [ref=f11e485]: Supabase 雲端 PostgreSQL
                    - text: 資料庫，具備並發防超賣樂觀鎖防護與現代化
                    - strong [ref=f11e486]: Tabler SaaS 營運儀表板
                    - text: 。
                  - separator [ref=f11e487]
                  - generic [ref=f11e488]:
                    - heading "🌟 核心架構與技術亮點" [level=2] [ref=f11e489]
                    - 'link "Permalink: 🌟 核心架構與技術亮點" [ref=f11e490] [cursor=pointer]':
                      - /url: "#-核心架構與技術亮點"
                  - list [ref=f11e493]:
                    - listitem [ref=f11e494]:
                      - paragraph [ref=f11e495]:
                        - strong [ref=f11e496]: ACID 資料庫交易與稽核流水帳（Audit Ledger）
                        - text: ：
                      - list [ref=f11e497]:
                        - listitem [ref=f11e498]:
                          - text: 任何進貨入庫（Inbound）與銷貨出庫（Outbound），均透過 EF Core
                          - code [ref=f11e499]: BeginTransactionAsync()
                          - text: 執行。
                        - listitem [ref=f11e500]: 保證「庫存數值異動」與「不可竄改的流水帳記錄（StockMovements）」同生共死，落實財務級別的帳實相符。
                    - listitem [ref=f11e501]:
                      - paragraph [ref=f11e502]:
                        - strong [ref=f11e503]: 高並發防超賣機制（Race Condition Protection）
                        - text: ：
                      - list [ref=f11e504]:
                        - listitem [ref=f11e505]:
                          - strong [ref=f11e506]: 底層保證
                          - text: ：PostgreSQL 資料庫層級建立
                          - code [ref=f11e507]: CHECK ("CurrentQty" >= 0)
                          - text: 約束，杜絕負數庫存。
                        - listitem [ref=f11e508]:
                          - strong [ref=f11e509]: 應用層保護
                          - text: ：整合 PostgreSQL 原生
                          - code [ref=f11e510]: xmin
                          - text: 系統隱藏欄位作為 EF Core 樂觀鎖版本 Token，並發衝突時拋出例外並防禦。
                    - listitem [ref=f11e511]:
                      - paragraph [ref=f11e512]:
                        - strong [ref=f11e513]: 統一錯誤格式（RFC 7807 ProblemDetails）
                        - text: ：
                      - list [ref=f11e514]:
                        - listitem [ref=f11e515]: 全域 Middleware Pipeline 捕捉未預期例外，統一封裝為標準 RFC 7807 格式，避免伺服器敏感堆疊外洩。
                    - listitem [ref=f11e516]:
                      - paragraph [ref=f11e517]:
                        - strong [ref=f11e518]: 現代化 Tabler SaaS 前端儀表板
                        - text: ：
                      - list [ref=f11e519]:
                        - listitem [ref=f11e520]:
                          - strong [ref=f11e521]: 4 欄式 KPI 營運指標卡
                          - text: ：即時掌握商品品項數、總庫存量、低庫存警戒品項。
                        - listitem [ref=f11e522]:
                          - strong [ref=f11e523]: 防閃爍 (No FOUC) 深淺主題
                          - text: ：亮色 / 暗黑模式一秒平滑切換。
                        - listitem [ref=f11e524]:
                          - strong [ref=f11e525]: Modal-First SPA CRUD
                          - text: ：新增商品與出入庫操作皆於磨砂彈窗內非同步完成，零頁面跳轉。
                  - separator [ref=f11e526]
